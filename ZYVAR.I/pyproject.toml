[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zyvarnth"
version = "0.1.0"
description = "A secure, modular personal AI desktop assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PyQt6>=6.7,<7",
  "google-genai>=1.20,<2",
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
  "psutil>=6,<8",
  "keyring>=25,<27",
  "platformdirs>=4,<5",
  "python-dotenv>=1,<2",
  "playwright>=1.50,<2",
  "ddgs>=9,<10",
  "Pillow>=10,<13",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
notify = ["plyer>=2,<3"]
desktop = ["pyautogui>=0.9.54,<1", "pycaw>=20240210; platform_system == 'Windows'"]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "ruff>=0.9,<1"]

[project.scripts]
zyvarnth = "zyvarnth.app:main"

[tool.setuptools.packages.find]
include = ["zyvarnth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

